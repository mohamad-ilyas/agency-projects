# CI for the todo-app project: unit + acceptance tests (Vitest/jsdom) and the preview build.
# Free tier: one ubuntu job, typically a few minutes. No secrets are used.
name: todo-app CI

on:
  push:
    branches: [project/todo-app]
    paths: ['projects/todo-app/**', '.github/workflows/todo-app.yml']
  pull_request:
    paths: ['projects/todo-app/**', '.github/workflows/todo-app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/todo-app/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/todo-app/app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:preview
